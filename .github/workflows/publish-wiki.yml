name: Publish Wiki
on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:
concurrency:
  group: publish-wiki
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/strict-wiki-validation.yml
  publish:
    needs: verify-publication
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Publish wiki
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e
        with:
          strategy: init
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}
