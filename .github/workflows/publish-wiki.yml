name: Publish Wiki
on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:
concurrency:
  group: publish-wiki
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          strategy: init
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}
